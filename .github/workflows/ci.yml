name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Build & test
    # The app project lives in app/. Every build step runs there.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Build the same artifact we deploy — the design inspector is OFF (the
      # self-hosted deploy does not set HF_DESIGN_INSPECTOR). A green build here
      # also exercises the @higgsfield-ai/icons -> Material Symbols shim.
      - name: Build
        run: bun run build

      # NOTE: package unit tests (bun run test:packages) are intentionally not
      # run in CI. The vendored @higgsfield/quanta kit's tests import the
      # Higgsfield-private `@higgsfield-ai/icons` package, which is unavailable
      # on public npm, so they cannot pass off-platform. Typecheck + build above
      # validate the actual deployed app.
